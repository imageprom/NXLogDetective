format: botsig/1
site: example.com
updated: "2026-10-01"

lists:
  # Битые URL, с которых начинает визит оператор спама (без «/» в конце → 404)
  spam_entry_paths:
    - /projects/project-alpha
    - /projects/project-beta
    - /projects/project-kappa
    - /projects/project-iota
    - /projects/project-theta
    - /projects/project-delta/flat/filter/rooms-is-1-or-3/complete_date-is-%D1%81%D0%B4%D0%B0%D0%BD/apply
  # Самые редкие из них — почти исключительно оператор (≤10 IP за 20 дней)
  spam_entry_paths_rare:
    - /projects/project-alpha
    - /projects/project-delta/flat/filter/rooms-is-1-or-3/complete_date-is-%D1%81%D0%B4%D0%B0%D0%BD/apply
  # Старые обработчики форм, удалённые 21–22.09 (обращение к ним = бот со старым скриптом)
  removed_form_handlers:
    - /local/templates/main/forms/callback.php
    - /local/templates/main/forms/modal_callback.php
    - /local/templates/main/forms/form_excursion.php
    - /local/templates/main/forms/getPrice.php
    - /local/templates/main/forms/callback_newproject.php
    - /local/templates/main/forms/modal_mortgage_consultation.php
  # Проверенные сети поисковых и рекламных роботов: семейство UA → разрешённые ASN
  verified_crawlers:
    Googlebot: [15169]
    Googlebot-Image: [15169]
    AdsBot-Google: [15169]
    Google-Read-Aloud: [15169]
    YandexBot: [13238]
    YandexRenderResourcesBot: [13238]
    YandexMetrika: [13238]
    YaDirectFetcher: [13238]
    YandexMarket: [13238]
    Bingbot: [8075]
    Applebot: [714]
  # Известные адреса (IOC) — использовать вместе с поведением, адреса домашних сетей быстро меняются
  ioc_spam_ips: [46.172.22.189, 89.111.30.251, 5.140.92.45, 5.42.98.229, 176.15.175.172, 176.15.246.135,
                 31.162.43.239, 5.42.34.2, 5.129.255.140, 5.129.220.164, 185.197.75.109, 45.144.220.114,
                 95.167.182.119, 188.19.48.132, 176.15.175.225, 5.140.83.123, 188.19.150.230, 195.209.215.103,
                 217.60.183.238, 88.218.170.9, 109.196.102.196]
  # Белый список: адреса сотрудников/подрядчика, которые не надо помечать (заполняется вручную)
  allowlist_ips: []
  ioc_scanner_ips: [94.154.46.244, 94.154.46.247, 94.154.46.249, 87.120.104.29, 185.177.72.69, 185.177.72.100, 185.177.72.38]

signatures:

  # ---------------- СПАМ ФОРМ ----------------
  - id: BS-SPAM-001
    title: "Оператор спама: вход на битый URL без реферера → главная → заявка"
    version: 1
    status: active
    category: form_spam
    severity: critical
    confidence: high
    action: [reject_lead, block_ip]
    where: {ip: {not_in_list: allowlist_ips}}
    scope: session
    key: ip
    sequence:
      - as: entry
        first_page_in_session: true
        match: {method: GET, status: 404, referer: "-", base: {re: "^/projects/"}}
      - as: home
        within: 900
        match: {method: GET, base: "/", status: 200}
      - as: submit
        within: 300
        max_pages_between: 4
        match: {is_form_post: true}
    require:
      - {agg: count, match: {base: {re: "^/bitrix/(admin|tools/public_session)"}}, op: "==", value: 0}
    description: >
      Визит начинается с прямого захода на адрес проекта без «/» (ответ 404), затем главная,
      через 20–60 с — отправка формы. Ровно так действовали 12+ IP оператора 14.09–29.09.
    false_positives: "Человек, открывший старую ссылку из закладок и сразу оставивший заявку на главной. В данных не встречено."
    evidence: ["46.172.22.189 14.09 08:33", "89.111.30.251 15.09 12:58", "188.19.48.132 24.09 12:10", "5.140.83.123 29.09 07:42"]
    first_seen: "2026-09-14"
    last_seen: "2026-09-29"

  - id: BS-SPAM-002
    title: "Оператор спама: смена IP посреди визита (реферер — чужой 404)"
    version: 1
    status: active
    category: form_spam
    severity: critical
    confidence: medium
    action: [reject_lead, block_ip]
    where: {ip: {not_in_list: allowlist_ips}}
    scope: session
    sequence:
      - as: entry
        first_page_in_session: true
        match: {ref_internal: true, ref_seen_404_other_ip: {lte: 1800}, ref_path: {re: "^/projects/"}}
      - as: submit
        within: 900
        max_pages_between: 4
        match: {is_form_post: true}
    require:
      - {agg: count, match: {base: {re: "^/bitrix/(admin|tools/public_session)"}}, op: "==", value: 0}
    description: >
      Первая же страница визита пришла «со страницы» сайта, которую этот IP не открывал, а другой IP
      открыл не более 30 мин назад и получил 404. Значит, браузер сменил IP (прокси) — и затем отправил форму.
    false_positives: "Реферер можно подделать; вывод «тот же оператор» сохраняется, «смена IP» — нет."
    evidence: ["45.91.53.216 → 185.197.75.109 14.09 10:31→10:37", "45.90.99.53 → 45.144.220.114 21.09 10:28→10:39"]

  - id: BS-SPAM-003
    title: "Отправка формы без единого просмотра страницы"
    version: 1
    status: active
    category: form_spam
    severity: high
    confidence: medium
    action: [reject_lead, flag]
    where: {ip: {not_in_list: allowlist_ips}}
    scope: session
    require:
      - {agg: count, match: {base: {re: "^/bitrix/(admin|tools/public_session)"}}, op: "==", value: 0}
      - {agg: count, match: {is_form_post: true}, op: ">=", value: 1}
      - {agg: count, match: {is_page: true}, op: "==", value: 0}
    description: "POST в обработчик формы, а страниц сайта в этом визите не открывалось."
    false_positives: "Человек держал вкладку открытой дольше 30 мин и только потом отправил форму."
    evidence: ["217.60.183.238 13.09 (6 отправок)", "5.129.220.164 14.09 10:02", "198.51.100.24 23.09 20:50"]

  - id: BS-SPAM-004
    title: "Быстрый обход страниц и пачка заявок"
    version: 1
    status: active
    category: form_spam
    severity: high
    confidence: high
    action: [reject_lead, block_ip]
    where: {ip: {not_in_list: allowlist_ips}}
    scope: session
    require:
      - {agg: count, match: {base: {re: "^/bitrix/(admin|tools/public_session)"}}, op: "==", value: 0}
      - {agg: burst, match: {is_page: true}, window: 15, op: ">=", value: 6}
      - {agg: count, match: {is_form_post: true}, op: ">=", value: 1}
      - {agg: burst, match: {is_form_post: true}, window: 60, op: ">=", value: 2}
    description: "Не меньше 6 страниц за 15 с и не меньше 2 отправок форм за минуту — человек так не делает."
    evidence: ["195.209.215.103 30.09 00:16 — 15 ссылок с Карт за 6 с, 4 заявки за 11 с"]

  - id: BS-SPAM-005
    title: "Ротация User-Agent при отправке форм"
    version: 1
    status: active
    category: form_spam
    severity: high
    confidence: high
    action: [reject_lead, block_ip]
    scope: window
    window: day
    where: {is_form_post: true, ip: {not_in_list: allowlist_ips}}
    require:
      - {agg: distinct, field: ua, op: ">=", value: 3}
    description: "С одного IP за сутки заявки отправлялись из 3+ разных «браузеров»."
    false_positives: "Офис за NAT, где несколько сотрудников отправляют формы."
    evidence: ["217.60.183.238 13.09, 01.10"]

  - id: BS-SPAM-006
    title: "Обращение к удалённым обработчикам форм"
    version: 1
    status: active
    category: form_spam
    severity: medium
    confidence: high
    action: [block_ip]
    scope: request
    match: {method: POST, base: {in_list: removed_form_handlers}, status: 404}
    description: "POST на старые адреса форм, удалённые при переходе на form.php (с 22.09). Делает только бот со старым скриптом."
    evidence: ["217.60.183.238 01.10 (9 раз)"]
    first_seen: "2026-10-01"

  - id: BS-SPAM-007
    title: "Известный IP оператора спама (IOC)"
    version: 1
    status: active
    category: form_spam
    severity: high
    confidence: medium
    action: [reject_lead, flag]
    scope: request
    match: {ip: {in_list: ioc_spam_ips}, is_form_post: true}
    description: "Отправка формы с IP, уже замеченного в спаме. Домашние IP переходят к другим абонентам — использовать как флаг, не как вечный бан."

  # ---------------- РАЗВЕДКА ----------------
  - id: BS-RECON-001
    title: "Разведка оператора: заход на редкий битый URL без заявки"
    version: 1
    status: active
    category: recon
    severity: low
    confidence: medium
    action: [monitor]
    scope: request
    match: {method: GET, status: 404, referer: "-", base: {in_list: spam_entry_paths_rare}}
    description: "Прямой заход на один из двух самых редких URL оператора. Часто за 3–15 мин до атаки с другого IP."
    false_positives: "Роботы Google Ads и Яндекс.Директа проверяют те же ссылки — их отсекает фильтр объявленных роботов."
    evidence: ["104.28.230.247 14.09 14:31 → атака 89.111.30.251 14:42", "104.28.198.246 15.09 12:55 → атака 12:58"]

  # ---------------- ПАРСЕРЫ ----------------
  - id: BS-SCRAPE-001
    title: "Парсер без браузера: страницы без статики и без подгрузки форм"
    version: 1
    status: active
    category: scraper
    severity: low
    confidence: high
    action: [rate_limit]
    scope: session
    where: {is_bot_ua: false}
    sequence:
      - as: entry
        first_page_in_session: true
        match: {referer: "-", is_desktop: true, yclid: {exists: false}, status: {not_in: [500, 502, 503, 504]}}
    require:
      - {agg: count, match: {is_page: true}, op: ">=", value: 1}
      - {agg: count, match: {is_static: true}, op: "==", value: 0}
      - {agg: count, match: {is_form_get: true}, op: "==", value: 0}
    description: "Настоящий браузер на каждой странице грузит CSS/JS и модальные формы form.php. Здесь — только HTML. Визиты с рекламного клика и со страницы-ошибки 5xx исключены (на странице ошибки статики нет и у людей)."
    evidence: ["Alibaba Cloud SG: 836 IP", "HostRoyale: 167 IP", "Frontier US 27–29.09: 107 IP"]

  - id: BS-SCRAPE-002
    title: "Парсер принял ссылку tel: за адрес страницы"
    version: 1
    status: active
    category: scraper
    severity: medium
    confidence: high
    action: [block_ip]
    scope: request
    match: {path: {re: "/tel:[0-9+]"}}
    description: "Запрос вида /flat/…/n119/tel:88312601575 — относительная ссылка tel: склеена с адресом страницы. Браузер так не делает."

  # ---------------- СКАНЕРЫ УЯЗВИМОСТЕЙ ----------------
  - id: BS-VULN-001
    title: "Перебор служебных файлов и админок"
    version: 1
    status: active
    category: vuln_scan
    severity: high
    confidence: high
    action: [block_ip]
    scope: window
    window: hour
    where:
      base: {re: "(?i)/(\\.env|\\.git|\\.aws|\\.ssh|\\.DS_Store|wp-login|wp-admin|wp-config|xmlrpc|phpmyadmin|docker-compose|secrets?\\.ya?ml|config\\.ya?ml|database\\.ya?ml|\\.gitlab-ci|serverless\\.ya?ml|actuator|cgi-bin|server-status|\\.sql|backup\\.|debug/default)"}
    require:
      - {agg: distinct, field: base, op: ">=", value: 3}
    description: "За час 3+ разных запроса к файлам с паролями, ключами, конфигам и чужим CMS."
    evidence: ["94.154.46.x (TR) под маской Googlebot", "185.177.72.x (FR) curl", "34.158.109.94 (GCP) с ротацией UA"]

  # ---------------- ПОДДЕЛЬНЫЕ РОБОТЫ ----------------
  - id: BS-FAKE-001
    title: "Поддельный поисковый/рекламный робот (UA не совпадает с сетью)"
    version: 1
    status: active
    category: fake_crawler
    severity: high
    confidence: high
    action: [block_ip]
    scope: request
    match: {ua_family: {in_list: verified_crawlers}, asn_verified: false}
    description: "UA Googlebot/YandexBot/Bingbot/Applebot и т. п., но адрес не из сети этой компании."
    evidence: ["94.154.46.244 «Googlebot» TR", "87.120.104.29 «Googlebot» NO", "Nicolas FAVRE AS212066 «YandexBot»"]

  - id: BS-FAKE-002
    title: "Ротатор: один IP представляется многими разными роботами"
    version: 1
    status: active
    category: fake_crawler
    severity: high
    confidence: high
    action: [block_ip]
    scope: window
    window: day
    where: {is_bot_ua: true, asn: {not_in: [13238, 15169, 8075, 714]}}
    require:
      - {agg: distinct, field: ua_family, op: ">=", value: 4}
    description: "За сутки с одного IP пришли 4+ разных «роботов» (GPTBot, ClaudeBot, Applebot…). Настоящие роботы так не делают."
    evidence: ["23 адреса Google Cloud (AS396982) NL/US/JP, напр. 34.143.66.36, 34.158.109.94"]

  - id: BS-HEADLESS-001
    title: "Headless-браузер"
    version: 1
    status: active
    category: headless
    severity: low
    confidence: high
    action: [flag]
    scope: request
    match: {ua: {re: "HeadlessChrome|Lightpanda|PhantomJS|Puppeteer|Playwright"}}

  # ---------------- НАКРУТКА РЕКЛАМЫ ----------------
  - id: BS-CLICK-001
    title: "Одно устройство кликает рекламу 8+ раз за день и не смотрит квартиры"
    version: 1
    status: experimental
    category: click_fraud
    severity: medium
    confidence: low
    action: [monitor]
    scope: window
    window: day
    key: ip_ua
    where: {is_bot_ua: false}
    require:
      - {agg: distinct, field: yclid, op: ">=", value: 8}
      - {agg: count, match: {is_flat_card: true}, op: "==", value: 0}
    description: "8+ разных рекламных кликов (yclid) за сутки с одной пары IP+UA без единой карточки квартиры."
    false_positives: "Мобильные операторы (T2, МегаФон) — CGNAT: за одним IP много абонентов с одинаковым урезанным UA «Android 10; K». Только для мониторинга."
